# LifeQuest — run it anywhere with one command.
#
#   1. Copy this file (or clone the repo).
#   2. docker compose up -d
#
# That's it — no .env file needed. Sensible defaults are built in, so the
# app starts on http://localhost:8000 (API) with its own database, worker
# and cache. Works on any server, VPS, or container service that runs
# Docker Compose (home server, Oracle Cloud, GCP, AWS, ...).
#
# Services: api (FastAPI, 2 uvicorn workers), db (PostGIS), worker
# (background evaluation jobs), redis (read cache + live dots),
# cloudflared (OPTIONAL Cloudflare Tunnel -> your own domain).
#
# api + worker use the SAME Docker Hub image, different commands:
#   api    -> /usr/bin/python3 -m uvicorn app.main:app ...
#   worker -> /usr/bin/python3 -m app.worker
# The image is distroless (no shell, no `uvicorn`/`python` binary on
# PATH), so commands must use the absolute python3 path + -m.
# IMAGE_TAG picks the tag: staging / latest (default) / sha-<commit>.
#
# The API runs WITHOUT --reload: restart it after a code change
# (docker compose restart api). The worker has no auto-reload either
# (docker compose restart worker).
#
# --- Customising (all optional, via environment or a .env file) ---
#   IMAGE_TAG=staging        use the staging image instead of latest
#   API_PORT=8080            expose the API on another host port
#   POSTGRES_PASSWORD=...    database password (also update DATABASE_URL)
#   DATABASE_URL=...         full database URL (overrides the default)
#   JWT_SECRET=...           secret for signing login tokens
#   CLOUDFLARE_TUNNEL_TOKEN=...  your tunnel token (only for --profile prod)
#
# --- Production warning ---
# The defaults below (lifequest/lifequest password, dev JWT secret) are
# ONLY for trying the app out. For real use, set strong values:
#   POSTGRES_PASSWORD=<long random password>
#   DATABASE_URL=postgresql+psycopg://lifequest:<same password>@db:5432/lifequest
#   JWT_SECRET=<long random string>
# Never share a .env file that holds real secrets.
#
# Tunnel (optional, only under the "prod" profile):
#   docker compose --profile prod up -d   (needs CLOUDFLARE_TUNNEL_TOKEN)
services:
  api:
    image: raoshahzaib/lifequest-api:${IMAGE_TAG:-latest}
    container_name: lifequest-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lifequest:lifequest@db:5432/lifequest}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-in-production}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    command: /usr/bin/python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgis/postgis:16-3.4
    container_name: lifequest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifequest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifequest}
      POSTGRES_DB: ${POSTGRES_DB:-lifequest}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lifequest-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lifequest} -d $${POSTGRES_DB:-lifequest}"]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    image: raoshahzaib/lifequest-api:${IMAGE_TAG:-latest}
    container_name: lifequest-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lifequest:lifequest@db:5432/lifequest}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-in-production}
      REDIS_URL: redis://redis:6379/0
    command: /usr/bin/python3 -m app.worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    container_name: lifequest-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lifequest-tunnel
    profiles: ["prod"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  lifequest-data:
