# LifeQuest — backend (FastAPI + worker + PostGIS + Redis + Cloudflare Tunnel).
# Services: api (FastAPI, 2 uvicorn workers), db (PostGIS), worker
# (background evaluation jobs), redis (read cache + live dots),
# cloudflared (Cloudflare Tunnel -> api.raoshahzaib.site).
#
# Images come from Docker Hub (built by CI):
#   api + worker use the SAME image, different commands:
#     api    -> uvicorn app.main:app ...
#     worker -> python -m app.worker
#   IMAGE_TAG picks the tag (set it in .env):
#     staging    -> IMAGE_TAG=staging   (CI builds this from the staging branch)
#     production -> IMAGE_TAG=latest    (CI builds this from main; or pin a sha- tag)
#   Default is latest.
#
# The API runs WITHOUT --reload: restart it after a code change
# (docker compose restart api). The worker has no auto-reload either
# (docker compose restart worker).
#
# Tunnel runs only under the "prod" profile:
#   staging: docker compose up -d            (api/db/worker/redis only)
#   prod:    docker compose --profile prod up -d   (all 5, incl. tunnel)
#
# Secrets (DATABASE_URL, JWT_SECRET, POSTGRES_*, CLOUDFLARE_TUNNEL_TOKEN)
# live in .env (NOT in git) — never hardcode them here.
services:
  api:
    image: raoshahzaib/lifequest-api:${IMAGE_TAG:-latest}
    container_name: lifequest-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgis/postgis:16-3.4
    container_name: lifequest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifequest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lifequest}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lifequest-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lifequest} -d $${POSTGRES_DB:-lifequest}"]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    image: raoshahzaib/lifequest-api:${IMAGE_TAG:-latest}
    container_name: lifequest-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: python -m app.worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    container_name: lifequest-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lifequest-tunnel
    profiles: ["prod"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  lifequest-data:
